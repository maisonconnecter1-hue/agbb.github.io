<!DOCTYPE html>
<html>
<head>
  <title>AGBB AI - Vocal Coach Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #050505; color: white; margin: 0; text-align: center; }
    .header { background: #00ff00; color: black; padding: 10px; font-weight: bold; display: flex; justify-content: space-around; align-items: center; }
    .main-grid { display: flex; gap: 10px; padding: 10px; }
    .video-section { flex: 3; position: relative; }
    .sidebar { flex: 1; background: #1a1a1a; padding: 15px; border-radius: 15px; border: 1px solid #333; max-height: 85vh; overflow-y: auto; }
    canvas, #video-playback { width: 100%; border-radius: 15px; border: 2px solid #333; }
    .control-panel { background: #111; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; gap: 10px; justify-content: center; align-items: center; }
    button { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .btn-green { background: #00ff00; color: black; }
    .btn-vocal { background: #ffaa00; color: black; }
    input { padding: 8px; border-radius: 5px; background: #333; color: white; border: 1px solid #00ff00; }
    .status-indicator { font-size: 20px; font-weight: bold; margin: 5px; padding: 8px; border-radius: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <span>AGBB AI - VOCAL COACHING</span>
    <div>Gardien : <input type="text" id="gkName" value="Gardien_1"></div>
    <button class="btn-vocal" onclick="testVoice()">🔊 TESTER LE SON</button>
  </div>

  <div id="visual-status" class="status-indicator" style="background: #333;">PRÊT POUR L'ENTRAÎNEMENT</div>

  <div class="main-grid">
    <div class="video-section">
      <div class="control-panel">
        <button class="btn-green" onclick="startAnalysis()">ACTIVER DIRECT</button>
        <button id="recordBtn" style="background:#ff4444; color:white; display:none;" onclick="toggleRecording()">REC</button>
        <button onclick="takeSnapshot()">PHOTO</button>
        <label>Vitesse : </label>
        <select id="speedRate" onchange="updateSpeed()" style="background:#333; color:white;">
            <option value="1">1x</option>
            <option value="0.5">0.5x</option>
            <option value="0.1">0.1x</option>
        </select>
      </div>
      <canvas id="output_canvas" width="1280" height="720"></canvas>
      <video id="input_video" style="display:none;"></video>
      <video id="video-playback" style="display:none;" controls></video>
    </div>

    <div class="sidebar">
      <h3>LOG & ANALYSE</h3>
      <table id="sessionLog" style="width:100%; font-size:12px;">
        <thead><tr style="color:#00ff00;"><th>Heure</th><th>Poste</th><th>Mains</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusDiv = document.getElementById('visual-status');
    const videoElement = document.getElementById('input_video');
    const playbackElement = document.getElementById('video-playback');

    let lastSpeechTime = 0;
    let mediaRecorder;
    let recordedChunks = [];

    // --- FONCTION VOCALE ---
    function speak(text) {
        const now = Date.now();
        if (now - lastSpeechTime > 3000) { // Anti-répétition (toutes les 3 sec max)
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 1.2; // Un peu plus rapide pour le sport
            window.speechSynthesis.speak(utterance);
            lastSpeechTime = now;
        }
    }

    function testVoice() { speak("Système vocal AGBB activé. Prêt pour l'entraînement."); }

    function calculateAngle(A, B, C) {
        const a = Math.sqrt(Math.pow(C.x - B.x, 2) + Math.pow(C.y - B.y, 2));
        const b = Math.sqrt(Math.pow(C.x - A.x, 2) + Math.pow(C.y - A.y, 2));
        const c = Math.sqrt(Math.pow(B.x - A.x, 2) + Math.pow(B.y - A.y, 2));
        const cosTheta = (Math.pow(a, 2) + Math.pow(c, 2) - Math.pow(b, 2)) / (2 * a * c);
        return Math.round(Math.acos(cosTheta) * (180 / Math.PI));
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const angK = calculateAngle(results.poseLandmarks[24], results.poseLandmarks[26], results.poseLandmarks[28]);
        const poignetG = results.poseLandmarks[15];
        const poignetD = results.poseLandmarks[16];
        const distMains = Math.sqrt(Math.pow(poignetG.x - poignetD.x, 2) + Math.pow(poignetG.y - poignetD.y, 2));

        // --- COACHING VOCAL AUTOMATIQUE ---
        if (angK > 160) {
            statusDiv.innerText = "⚠️ TROP HAUT !";
            statusDiv.style.color = "#FF4444";
            speak("Baisse-toi"); 
        } else if (distMains > 0.15) {
            statusDiv.innerText = "⚠️ MAINS LARGES !";
            statusDiv.style.color = "#FFAA00";
            speak("Ferme les mains");
        } else {
            statusDiv.innerText = "POSITION PARFAITE ✅";
            statusDiv.style.color = "#00FF00";
        }

        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: angK < 160 ? '#00FF00' : '#FF0000', lineWidth: 4});
      }
      canvasCtx.restore();
    }

    // --- Fonctions utilitaires ---
    function toggleRecording() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            document.getElementById('recordBtn').innerText = "REC";
        } else {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(canvasElement.captureStream(30));
            mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: "video/webm" });
                playbackElement.src = URL.createObjectURL(blob);
                canvasElement.style.display = "none";
                playbackElement.style.display = "block";
            };
            mediaRecorder.start();
            document.getElementById('recordBtn').innerText = "STOP";
        }
    }

    function takeSnapshot() {
        const link = document.createElement('a');
        link.download = `AGBB_Pro_${document.getElementById('gkName').value}.png`;
        link.href = canvasElement.toDataURL();
        link.click();
    }

    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5 });
    pose.onResults(onResults);

    function startAnalysis() {
        document.getElementById('recordBtn').style.display = "inline-block";
        canvasElement.style.display = "block";
        playbackElement.style.display = "none";
        new Camera(videoElement, {
            onFrame: async () => { await pose.send({image: videoElement}); },
            width: 1280, height: 720
        }).start();
    }
  </script>
</body>
</html>
