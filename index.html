<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGBB PRO AI - Coach Vocal & Caméra</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; margin: 0; text-align: center; }
    .header { background: #00ff00; color: black; padding: 15px; font-weight: bold; display: flex; justify-content: space-around; align-items: center; }
    .main-grid { display: grid; grid-template-columns: 3fr 1fr; gap: 15px; padding: 15px; }
    .video-section { position: relative; background: #000; border-radius: 20px; border: 2px solid #333; overflow: hidden; }
    canvas, #replay { width: 100%; height: auto; border-radius: 15px; }
    .sidebar { background: #151515; padding: 15px; border-radius: 20px; border: 1px solid #333; max-height: 85vh; overflow-y: auto; }
    .control-panel { background: #111; padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
    button { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .btn-start { background: #00ff00; color: black; }
    .btn-rec { background: #ff4444; color: white; }
    .btn-audio { background: #00aaff; color: white; }
    select, input[type="range"] { padding: 8px; border-radius: 5px; background: #333; color: white; border: 1px solid #00ff00; }
    .status-bar { font-size: 20px; font-weight: bold; margin: 10px; padding: 10px; border-radius: 10px; background: rgba(255,255,255,0.05); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    th, td { border: 1px solid #333; padding: 8px; }
    th { background: #00ff00; color: black; }
  </style>
</head>
<body>

  <div class="header">
    <span>AGBB AI - PERFORMANCE v6.0</span>
    <div>Gardien : <input type="text" id="gkName" value="Gardien_1" style="width:100px;"></div>
    <div style="display:flex; align-items:center; gap:10px;">
        <span>🔊</span>
        <input type="range" id="volRange" min="0" max="1" step="0.1" value="0.8">
        <button id="muteBtn" onclick="toggleMute()">COUPE SON</button>
    </div>
  </div>

  <div class="main-grid">
    <div class="video-container">
      <div class="control-panel">
        <select id="camSelect">
            <option value="user">Caméra Avant (Selfie)</option>
            <option value="environment" selected>Caméra Arrière (Terrain)</option>
        </select>
        <button class="btn-start" onclick="initCamera()">▶️ LANCER</button>
        <button id="recBtn" class="btn-rec" style="display:none;" onclick="toggleRecord()">🔴 REC</button>
        <select id="slowMo" onchange="updateReplaySpeed()">
            <option value="1">1x</option>
            <option value="0.5">0.5x</option>
            <option value="0.1">0.1x</option>
        </select>
      </div>

      <div id="feedback" class="status-bar">EN ATTENTE...</div>
      <canvas id="out_canvas" width="1280" height="720"></canvas>
      <video id="in_video" style="display:none;"></video>
      <video id="replay" style="display:none;" controls></video>
    </div>

    <div class="sidebar">
      <h3>LOG SESSION</h3>
      <table id="logTable">
        <thead><tr><th>Heure</th><th>Genou</th><th>Mains</th></tr></thead>
        <tbody></tbody>
      </table>
      <button style="margin-top:20px; width:100%;" onclick="exportCSV()">💾 EXPORT DATA</button>
    </div>
  </div>

  <script>
    const video = document.getElementById('in_video');
    const canvas = document.getElementById('out_canvas');
    const ctx = canvas.getContext('2d');
    const feedback = document.getElementById('feedback');
    const replay = document.getElementById('replay');
    const volRange = document.getElementById('volRange');
    
    let currentStream, recorder, chunks = [], isMuted = false, lastSpeak = 0, cameraActive = null;

    function toggleMute() {
        isMuted = !isMuted;
        document.getElementById('muteBtn').innerText = isMuted ? "ACTIVER SON" : "COUPE SON";
        document.getElementById('muteBtn').style.background = isMuted ? "#ff4444" : "#00aaff";
    }

    function talk(text) {
        if (isMuted) return;
        const now = Date.now();
        if (now - lastSpeak > 3500) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'fr-FR';
            msg.volume = volRange.value;
            window.speechSynthesis.speak(msg);
            lastSpeak = now;
        }
    }

    function calculateAngle(A, B, C) {
        let a = Math.sqrt(Math.pow(C.x-B.x, 2) + Math.pow(C.y-B.y, 2));
        let b = Math.sqrt(Math.pow(C.x-A.x, 2) + Math.pow(C.y-A.y, 2));
        let c = Math.sqrt(Math.pow(B.x-A.x, 2) + Math.pow(B.y-A.y, 2));
        return Math.round(Math.acos((a*a+c*c-b*b)/(2*a*c)) * (180/Math.PI));
    }

    function onResults(res) {
        ctx.save();
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height);

        if (res.poseLandmarks) {
            const p = res.poseLandmarks;
            const ang = calculateAngle(p[24], p[26], p[28]);
            const dist = Math.sqrt(Math.pow(p[15].x-p[16].x,2) + Math.pow(p[15].y-p[16].y,2));

            const isLow = ang < 155;
            const handsOk = dist < 0.14;
            const color = isLow ? "#00FF00" : "#FF0000";

            drawConnectors(ctx, p, POSE_CONNECTIONS, {color: color, lineWidth: 4});
            
            feedback.innerText = isLow ? "POSITION : PRÊT ✅" : "POSITION : TROP HAUT ! ❌";
            feedback.style.color = color;

            if (!isLow) talk("Baisse-toi");
            else if (!handsOk) talk("Ferme les mains");

            if (Math.random() > 0.98) {
                const time = new Date().toLocaleTimeString().split(' ')[0];
                const row = document.getElementById('logTable').tBodies[0].insertRow(0);
                row.innerHTML = `<td>${time}</td><td>${ang}°</td><td>${handsOk?'OK':'KO'}</td>`;
            }
        }
        ctx.restore();
    }

    const pose = new Pose({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
    pose.setOptions({modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5});
    pose.onResults(onResults);

    async function initCamera() {
        if (cameraActive) { cameraActive.stop(); }
        const mode = document.getElementById('camSelect').value;
        
        canvas.style.display = 'block'; replay.style.display = 'none';
        document.getElementById('recBtn').style.display = 'inline-block';

        cameraActive = new Camera(video, {
            onFrame: async () => { await pose.send({image: video}); },
            width: 1280, height: 720,
            facingMode: mode
        });
        cameraActive.start();
        talk("Système AGBB activé.");
    }

    function toggleRecord() {
        if (recorder && recorder.state === "recording") {
            recorder.stop();
            document.getElementById('recBtn').innerText = "🔴 REC";
        } else {
            chunks = [];
            recorder = new MediaRecorder(canvas.captureStream(30));
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                replay.src = URL.createObjectURL(new Blob(chunks, {type: "video/webm"}));
                canvas.style.display = 'none'; replay.style.display = 'block';
            };
            recorder.start();
            document.getElementById('recBtn').innerText = "⏹ STOP";
        }
    }

    function updateReplaySpeed() { replay.playbackRate = document.getElementById('slowMo').value; }
    function exportCSV() {
        let csv = "Heure;Angle;Mains\n";
        document.querySelectorAll("#logTable tbody tr").forEach(tr => {
            csv += `${tr.cells[0].innerText};${tr.cells[1].innerText};${tr.cells[2].innerText}\n`;
        });
        const b = new Blob([csv], {type:'text/csv'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download="AGBB_Export.csv"; a.click();
    }
  </script>
</body>
</html>
</html>
